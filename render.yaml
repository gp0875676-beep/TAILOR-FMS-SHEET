services:
  # Single Web Service: runs the Telegram bot (polling) AND a tiny health
  # endpoint bound to $PORT in the same process. Render's free tier only
  # gives free hours to Web Services (Background Workers need a paid plan),
  # so this is deliberately one combined service, not two.
  - type: web
    name: fms-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTHORIZED_CHAT_IDS
        sync: false
      - key: AUTHORIZED_USER_IDS
        sync: false
      - key: TEST_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fms-db
          property: connectionString
      - key: DRY_RUN
        value: "false"
      - key: LANGUAGE
        value: "both"

databases:
  - name: fms-db
    plan: free
    databaseName: fms
    user: fms
